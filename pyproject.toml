[project]
# NOTE: upstream's build path (configure.py, tools/download_tool.py, tools/vsgen/*)
# deliberately uses only the standard library plus certifi, so `python3 configure.py`
# keeps working with no virtualenv at all. Everything below is *our* reverse-engineering
# tooling and lives in optional groups so that property is preserved.
name = "halo-decomp-tools"
version = "0.1.0"
description = "RE tooling for the Halo CE build 2342 matching decompilation"
requires-python = ">=3.11"

# capstone is a DIRECT dependency, declared explicitly rather than inherited. It already
# arrives transitively via reccmp, but relying on that would mean our disassembly tooling
# silently breaks the day reccmp drops it or is itself removed — and reccmp is only
# marginally useful here (see tools/reccmp/README.md), so that day is plausible.
#
# The installed version depends on which extras are synced: angr caps capstone, so with
# `--extra angr` you get 5.0.7 and without it 5.0.9. Both satisfy >=5.0. Note `uv pip list`
# reports the base-only resolution rather than what is actually in .venv — check with
# `.venv/bin/python -c "import capstone; print(capstone.__version__)"` if it matters.
dependencies = ["capstone>=5.0"]

[project.optional-dependencies]
# Upstream's own requirement, declared so `uv run configure.py` works in the venv too.
build = ["certifi"]

# reccmp — the MSVC-x86 matching-decomp toolchain from the LEGO Island project.
# Ships reccmp-cvdump, which reads PDB 2.0 (the format pdb-decompiler cannot),
# plus vtable/stackcmp/datacmp/roadmap and a Ghidra importer.
reccmp = ["reccmp>=0.1.6"]

# pyghidra-mcp drives the Ghidra workspaces (see tools/ghidra/). Installed from the
# local checkout because we track its main branch, not a release.
mcp = ["mcp>=1.2", "httpx"]

# Symbolic execution, for recovering jump tables and computed constants that
# Ghidra's decompiler leaves as indirect branches.
#
# pycparser<3 is required: 3.0 turned CLexer.filename into a read-only property, but
# cffi's cparser still assigns to it (cffi/cparser.py:337). angr trips this the moment
# pyvex asks libvex for an op type, so `import angr` fails outright with
# "property 'filename' of 'CLexer' object has no setter". Not angr's bug, but ours to pin.
angr = ["angr", "pycparser<3"]

# dewolf emits far more idiomatic C than Ghidra's own decompiler from the same
# analysis. NOT on PyPI — it is a Ghidra-plugin-plus-Python-frontend installed from
# source (fkie-cad/dewolf) and pinned to a Ghidra version, so it is deliberately not
# an extra here. See docs/DECOMPILERS.md.

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.uv]
# The Ghidra-facing scripts shell out to analyzeHeadless and talk HTTP; they do not
# need the Ghidra jars on the Python path.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
# Upstream's files are excluded on purpose. Reformatting them would create noise in every
# diff we send back to punpckhdq/halo, so lint only covers code we actually own.
extend-exclude = [
  "build",
  "source",
  "configure.py",
  "tools/ninja_syntax.py",
  "tools/project_x86.py",
  "tools/download_tool.py",
  "tools/vsgen",
]
